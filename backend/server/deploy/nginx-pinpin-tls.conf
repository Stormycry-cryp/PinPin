# PinPin HTTPS entry only; keep the existing gateway, token, certificate, and all other sites.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gateway.example.com;

    ssl_certificate /etc/nginx/ssl/gateway.example.com/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/gateway.example.com/privkey.key;

    include /etc/nginx/snippets/pinpin-gateway.conf;
    location / { return 404; }
}
