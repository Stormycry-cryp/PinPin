# Include INSIDE the existing gateway.example.com TLS server block.
# Confirm 127.0.0.1:8789 is unused before deployment; keep gateway.py and this port aligned.
# Does not replace any existing server, certificate, or other location.
location = /ping/health {
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
}

location ~ ^/ping/v1/(decision|explanation)$ {
    client_max_body_size 12m;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_ignore_client_abort off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
    proxy_send_timeout 10s;
    send_timeout 10s;
    access_log off;
}
