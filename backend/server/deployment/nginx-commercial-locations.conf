# Include inside the existing, verified gateway.example.com TLS server block.
# The original /ping routes remain unchanged. No new default server or certificates.
location ^~ /pinpin/v1/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    proxy_next_upstream off;
    client_max_body_size 12m;
    access_log off;
}

location = /pinpin/health {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_next_upstream off;
    access_log off;
}
